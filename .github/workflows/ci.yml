# Fast checks on every change: shell lint and end-to-end tests of install.sh
# (with a local git fixture — no network cloning), including exact manifests
# of the projects it creates for every environment. Everything runs through
# scripts in dev/ci/, which can be run locally exactly the same way
# (see dev/ci/run-all-local.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: dev/ci/lint.sh

  test-install:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Runners have no nix; install it on the Linux leg so test-install.sh
      # also exercises install.sh's `--env nix` happy path.
      - uses: DeterminateSystems/nix-installer-action@v16
        if: runner.os == 'Linux'

      - run: dev/ci/test-install.sh
