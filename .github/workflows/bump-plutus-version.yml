name: Bump Plutus Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: plutus Release Version (e.g. 1.26.0.0)
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-plutus-version:
    name: Bump Plutus Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Bump Plutus Version
        env:
          PLUTUS_VERSION: ${{ github.event.inputs.version }}
        run: .github/ci/bump-plutus-version.sh "$PLUTUS_VERSION"

      # The pull request below is opened with GITHUB_TOKEN, which by design
      # triggers no pull_request workflows: ci.yaml never runs on it, and
      # auto-merge lands it immediately. So build the bumped template here,
      # before the pull request exists. 1.71.0.0 and 1.72.0.0 were merged
      # unbuilt and broke main for weeks.
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.6.7"
          cabal-version: latest

      - name: Restore cabal store
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            ~/.cabal/packages
            ~/.cache/cabal/packages
          # Same key family as ci.yaml's build-cabal job (local crypto libs).
          key: crypto-cabal-v2-${{ runner.os }}-9.6.7-local-${{ hashFiles('template/cabal.project') }}
          restore-keys: |
            crypto-cabal-v2-${{ runner.os }}-9.6.7-local-

      - name: Build the bumped template
        run: .github/ci/build-ghc-cabal.sh --crypto-libs local

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6.0.5
        with:
          branch: "bump-plutus-${{ github.event.inputs.version }}"
          title: Bump plutus Version to ${{ github.event.inputs.version }}
          commit-message: Bump plutus Version to ${{ github.event.inputs.version }}
          delete-branch: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Pull Request Auto-Merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash
          token: ${{ secrets.GITHUB_TOKEN }}
