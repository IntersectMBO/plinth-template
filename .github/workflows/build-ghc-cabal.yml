# Full build of the ghc-cabal template branch with a real toolchain, on both
# supported GHC series and both OSes. Heavy (compiles plutus and friends), so
# it runs on demand, on a weekly schedule, and when the relevant inputs
# change. Locally: dev/ci/build-ghc-cabal.sh
name: Build ghc-cabal project

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
    paths:
      - "cabal.project"
      - "plinth-template.cabal"
      - "src/**"
      - "app/**"
      - "scripts/get-crypto-libs.sh"
      - "scripts/pkg-config"
      - "install.sh"
      - "dev/ci/build-ghc-cabal.sh"
      - ".github/workflows/build-ghc-cabal.yml"

jobs:
  build:
    name: ghc ${{ matrix.ghc }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ghc: ["9.6.7", "9.12.2"]
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest

      - name: Ensure pkg-config (macOS)
        if: runner.os == 'macOS'
        run: command -v pkg-config || brew install pkgconf

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            ~/.cabal/packages
            ~/.cache/cabal/packages
          key: crypto-cabal-${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project') }}
          restore-keys: |
            crypto-cabal-${{ runner.os }}-${{ matrix.ghc }}-

      - run: dev/ci/build-ghc-cabal.sh
