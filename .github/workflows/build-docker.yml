# Full build of the docker template branch inside the devx devcontainer
# image — the same image devcontainers, Codespaces and standalone docker use.
# Locally: dev/ci/build-docker.sh (skips when docker is unavailable).
name: Build docker project

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "cabal.project"
      - "plinth-template.cabal"
      - "src/**"
      - "app/**"
      - ".devcontainer/**"
      - "install.sh"
      - "dev/ci/build-docker.sh"
      - ".github/workflows/build-docker.yml"

jobs:
  build:
    name: devx devcontainer (ghc96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: dev/ci/build-docker.sh
        env:
          PLINTH_REQUIRE_DOCKER: "1"
