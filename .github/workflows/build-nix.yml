# Full build of the nix template branch (which is also the demeter branch's
# content) inside its own `nix develop` shell, for both GHC series. Locally:
# dev/ci/build-nix.sh [--shell ghc96|ghc912]
name: Build nix project

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"
  pull_request:
    paths:
      - "cabal.project"
      - "plinth-template.cabal"
      - "src/**"
      - "app/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "install.sh"
      - "dev/ci/build-nix.sh"
      - ".github/workflows/build-nix.yml"

jobs:
  build:
    name: nix develop .#${{ matrix.shell }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [ghc96, ghc912]
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            extra-substituters = https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            accept-flake-config = true

      - run: dev/ci/build-nix.sh --shell ${{ matrix.shell }}
